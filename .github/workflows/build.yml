# Builds the Windows program ("docx-to-idml-X.Y.Z.exe").
# Runs on every pushed tag like v0.1.0 (and publishes a GitHub Release with the .exe),
# or by hand from the Actions tab ("Run workflow") on any branch, to check a build.
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller tkinterdnd2

      - name: Test
        run: |
          python tests/test_reader.py
          python tests/test_outline.py
          python tests/test_preflight.py
          python tests/test_idml_tools.py
          python tests/test_writer.py
          python tests/test_export.py
          python tests/test_layout.py
          python tests/test_updates.py
          python tests/test_service.py
          python tests/test_golden.py
          python tests/test_gui.py

      - name: Read the version (and check it matches the tag)
        shell: bash
        run: |
          v=$(python -c "import docx2idml; print(docx2idml.__version__)")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "The tag ${GITHUB_REF#refs/tags/} doesn't match the version in docx2idml/__init__.py ($v)."
            exit 1
          fi

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "docx-to-idml-${{ env.VERSION }}"
          --add-data "docx2idml/idml/base;docx2idml/idml/base"
          --collect-submodules fontTools.ttLib.tables
          --collect-all tkinterdnd2
          --hidden-import win32com.client --hidden-import pythoncom
          run_app.py

      - name: Check the .exe carries the IDML base files
        shell: bash
        run: |
          python - <<'PY'
          from PyInstaller.archive.readers import CArchiveReader
          names = " ".join(str(k) for k in CArchiveReader("dist/docx-to-idml-${{ env.VERSION }}.exe").toc)
          for need in ("designmap.xml", "snippets.xml", "Styles.xml", "Preferences.xml"):
              assert need in names, need + " missing from the .exe"
          print("base files present")
          PY

      - name: Run the .exe as other programs do (convert, result in JSON)
        shell: pwsh
        run: |
          # No update check here: it would download the latest release into dist.
          python -c "from docx2idml import appsettings; d = appsettings.load(); d['check_updates'] = False; appsettings.save(d)"
          $exe = "dist/docx-to-idml-${{ env.VERSION }}.exe"
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            "convert", "--result", "$env:RUNNER_TEMP/result.json", "--out", "$env:RUNNER_TEMP/out",
            "--name", "e01", "reference/manuscript")
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP/result.json"; exit 1 }

      - name: Check the result and the program's location record
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          tmp = os.environ["RUNNER_TEMP"]
          r = json.load(open(os.path.join(tmp, "result.json"), encoding="utf-8"))
          assert r["ok"] and os.path.exists(r["idml"]), r
          from docx2idml import service
          loc = json.load(open(service.locator_path(), encoding="utf-8"))
          assert loc["exe"].endswith("docx-to-idml-${{ env.VERSION }}.exe"), loc
          print("convert ok:", r["idml"], "; program.json:", loc)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: docx-to-idml
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
