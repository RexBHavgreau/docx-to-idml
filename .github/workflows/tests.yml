name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tests/test_reader.py
      - run: python tests/test_outline.py
      - run: python tests/test_preflight.py
      - run: python tests/test_idml_tools.py
      - run: python tests/test_writer.py
      - run: python tests/test_export.py
      - run: python tests/test_layout.py
